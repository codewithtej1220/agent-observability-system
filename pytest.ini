[pytest]
# Pytest configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may touch DB)
    api: API endpoint tests
    model: ML model tests
    slow: Slow tests (load tests, etc.)
    
# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=api
    --cov=anomaly_model
    --cov=embedding_pipeline
    --cov=rl_policy
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=60

# Minimum Python version
minversion = 3.8

# Test timeout (seconds)
timeout = 300

# Coverage options
[coverage:run]
source = api,anomaly_model,embedding_pipeline,rl_policy
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */migrations/*

[coverage:report]
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
