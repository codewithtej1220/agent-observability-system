# Full stack: PostgreSQL + API + dashboard.
#   docker compose up --build
#   open http://localhost:8080
# First start trains the models and seeds demo history (about 2 minutes).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aobs
      POSTGRES_PASSWORD: aobs
      POSTGRES_DB: aobs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      AOBS_DATABASE_URL: postgresql://aobs:aobs@postgres:5432/aobs
      AOBS_API_KEYS: ${AOBS_API_KEYS:-dev-local-key}
      AOBS_CORS_ORIGINS: http://localhost:8080
      AOBS_SEED_DEMO: ${AOBS_SEED_DEMO:-1}
    volumes:
      - artifacts:/app/artifacts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_KEY: ${AOBS_API_KEYS:-dev-local-key}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  artifacts:
